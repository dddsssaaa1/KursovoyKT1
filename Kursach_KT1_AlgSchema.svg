<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1250" width="720" height="1250" font-family="Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Блок-схема алгоритма КТ1, вариант 19</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Линии связей -->
  <g fill="none" stroke="#333" stroke-width="1.5">
    <line x1="300" y1="60" x2="300" y2="90" marker-end="url(#arr)"/>
    <line x1="300" y1="140" x2="300" y2="155" marker-end="url(#arr)"/>
    <line x1="300" y1="225" x2="300" y2="255" marker-end="url(#arr)"/>
    <line x1="430" y1="190" x2="470" y2="190" marker-end="url(#arr)"/>
    <line x1="300" y1="300" x2="300" y2="320" marker-end="url(#arr)"/>
    <line x1="300" y1="365" x2="300" y2="385" marker-end="url(#arr)"/>
    <line x1="300" y1="430" x2="300" y2="455" marker-end="url(#arr)"/>
    <line x1="180" y1="490" x2="150" y2="490" marker-end="url(#arr)"/>
    <line x1="300" y1="525" x2="300" y2="565" marker-end="url(#arr)"/>
    <line x1="430" y1="600" x2="460" y2="600" marker-end="url(#arr)"/>
    <line x1="300" y1="635" x2="300" y2="665" marker-end="url(#arr)"/>
    <line x1="300" y1="710" x2="300" y2="720" marker-end="url(#arr)"/>
    <line x1="300" y1="780" x2="300" y2="820" marker-end="url(#arr)"/>
    <line x1="300" y1="880" x2="300" y2="905" marker-end="url(#arr)"/>
    <line x1="300" y1="950" x2="300" y2="975" marker-end="url(#arr)"/>
    <line x1="300" y1="1045" x2="300" y2="1065" marker-end="url(#arr)"/>
    <line x1="300" y1="1110" x2="300" y2="1130" marker-end="url(#arr)"/>
    <line x1="300" y1="1175" x2="300" y2="1195" marker-end="url(#arr)"/>
    <polyline points="85,515 85,687 170,687" marker-end="url(#arr)"/>
    <polyline points="550,620 550,687 430,687" marker-end="url(#arr)"/>
    <polyline points="430,750 660,750 660,407 430,407" marker-end="url(#arr)"/>
    <polyline points="430,850 700,850 700,277 430,277" marker-end="url(#arr)"/>
    <polyline points="430,1010 600,1010 600,927 430,927" marker-end="url(#arr)"/>
  </g>

  <!-- Фигуры -->
  <g fill="#f4f8ff" stroke="#333" stroke-width="1.5">
    <rect x="200" y="20" width="200" height="40" rx="20"/>
    <rect x="170" y="90" width="260" height="50"/>
    <polygon points="300,155 430,190 300,225 170,190"/>
    <rect x="470" y="170" width="200" height="40"/>
    <rect x="170" y="255" width="260" height="45"/>
    <rect x="170" y="320" width="260" height="45"/>
    <rect x="170" y="385" width="260" height="45"/>
    <polygon points="300,455 420,490 300,525 180,490"/>
    <rect x="20" y="465" width="130" height="50"/>
    <polygon points="300,565 430,600 300,635 170,600"/>
    <rect x="460" y="580" width="180" height="40"/>
    <rect x="170" y="665" width="260" height="45"/>
    <polygon points="300,720 430,750 300,780 170,750"/>
    <polygon points="300,820 430,850 300,880 170,850"/>
    <rect x="170" y="905" width="260" height="45"/>
    <polygon points="300,975 430,1010 300,1045 170,1010"/>
    <rect x="170" y="1065" width="260" height="45"/>
    <rect x="170" y="1130" width="260" height="45"/>
    <rect x="200" y="1195" width="200" height="40" rx="20"/>
  </g>

  <!-- Текст блоков -->
  <g text-anchor="middle" fill="#000">
    <text x="300" y="45">Начало</text>
    <text x="300" y="110">Ввод измерений</text>
    <text x="300" y="126">(время, компонент, значение)</text>
    <text x="300" y="195">Данные корректны?</text>
    <text x="570" y="195">Ошибка ввода: выход</text>
    <text x="300" y="274">Для каждого компонента c</text>
    <text x="300" y="290">из {RAM, TMP, PWR}</text>
    <text x="300" y="339">Ряд c: все измерения c,</text>
    <text x="300" y="355">упорядоченные по времени</text>
    <text x="300" y="404">Вычислить Q[i] (k = 1, в %)</text>
    <text x="300" y="420">Q = 100·ΔX / среднее(|X|)</text>
    <text x="300" y="495">Знаменатель = 0?</text>
    <text x="85" y="485">Q не вычисляется,</text>
    <text x="85" y="501">состояние НОРМА</text>
    <text x="300" y="605">|Q| &gt; L (2.0 %)?</text>
    <text x="550" y="597">Отметить ТРЕВОГА</text>
    <text x="550" y="612">в отсчёте t</text>
    <text x="300" y="692">Следующее измерение ряда</text>
    <text x="300" y="755">Остались измерения?</text>
    <text x="300" y="855">Остались компоненты?</text>
    <text x="300" y="924">Для t = 1..5: подсчёт</text>
    <text x="300" y="940">компонентов в ТРЕВОГЕ</text>
    <text x="300" y="1005">Ровно один компонент</text>
    <text x="300" y="1021">в ТРЕВОГЕ?</text>
    <text x="300" y="1084">Записать инцидент в журнал</text>
    <text x="300" y="1100">(time, type, count, value)</text>
    <text x="300" y="1157">Вывод результатов и журнала</text>
    <text x="300" y="1220">Конец</text>
  </g>

  <!-- Подписи ветвлений -->
  <g font-size="12" fill="#333">
    <text x="445" y="182">нет</text>
    <text x="160" y="482">да</text>
    <text x="312" y="548">нет</text>
    <text x="440" y="592">да</text>
    <text x="312" y="652">нет</text>
    <text x="445" y="742">да</text>
    <text x="312" y="800">нет</text>
    <text x="445" y="842">да</text>
    <text x="312" y="893">нет</text>
    <text x="312" y="1060">да</text>
    <text x="445" y="1002">нет</text>
  </g>
</svg>
